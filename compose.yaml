services:
  app:
    build: .
    image: fedotmas-swarm
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      # FEDOTMAS_MODELS: openrouter:qwen/qwen3.8-flash,openrouter:qwen/qwen3.7-flash
      # FEDOTMAS_WEB_TOKEN: ""
      FEDOTMAS_MAX_RUNNING: "2"
    volumes:
      - fedotmas-data:/data
    init: true
    stop_grace_period: 30s
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/runs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  fedotmas-data:
